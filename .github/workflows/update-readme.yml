name: README aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"   # täglich 04:17 UTC
  workflow_dispatch:        # manuell startbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repo-Liste erzeugen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime, timezone

          user = os.environ["GH_USER"]
          req = urllib.request.Request(
              f"https://api.github.com/users/{user}/repos?type=owner&sort=pushed&per_page=100",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json"},
          )
          repos = json.load(urllib.request.urlopen(req, timeout=30))
          repos = [r for r in repos
                   if not r["fork"] and not r["archived"] and not r["private"]
                   and r["name"].lower() != user.lower()][:6]

          lines = []
          for r in repos:
              pushed = datetime.strptime(r["pushed_at"], "%Y-%m-%dT%H:%M:%SZ").strftime("%d.%m.%Y")
              parts = [f"- **[{r['name']}]({r['html_url']})**"]
              if r.get("description"):
                  parts.append(f"– {r['description']}")
              meta = " · ".join(x for x in [r.get("language"), f"aktualisiert {pushed}"] if x)
              lines.append(" ".join(parts) + f" <sub>{meta}</sub>")
          if not lines:
              lines.append("- Noch keine öffentlichen Repositories.")
          today = datetime.now(timezone.utc).strftime("%d.%m.%Y")
          lines.append(f"\n<sub>Automatisch aktualisiert am {today}</sub>")

          block = "<!-- REPOS:START -->\n" + "\n".join(lines) + "\n<!-- REPOS:END -->"
          with open("README.md", encoding="utf-8") as f:
              text = f.read()
          new = re.sub(r"<!-- REPOS:START -->.*?<!-- REPOS:END -->", lambda m: block, text, flags=re.S)
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new)
          PY

      - name: Committen, falls geändert
        run: |
          if git diff --quiet; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "README: Repo-Liste aktualisiert"
          git push
